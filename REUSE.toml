version = 1

# Everything is Apache-2.0, so LICENSES/ holds one license text. Files that
# take a comment carry a two-line header in the file itself. The annotations
# below cover files that cannot hold a comment or that tools generate or
# rewrite, and files that must stay verbatim.

# Lockfiles and other generated files.
[[annotations]]
path = [
  "mise.lock",
  "MODULE.bazel.lock",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# Version pins and ignore lists that hold one value per line, so tools read
# every line and a comment would break them.
[[annotations]]
path = [
  ".bazelversion",
  ".bazelignore",
  ".rylignore",
  ".cspell-words.txt",
  ".vale/config/vocabularies/project/*.txt",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# JSON cannot hold comments. That includes .mcp.json, the pinned awrel MCP
# server.
[[annotations]]
path = ["**/*.json", ".mcp.json"]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# Files that can take a comment but where GitHub or the toolchain expects the
# file to start with its own content, or that must stay verbatim. CODEOWNERS
# and README.md render on GitHub, and LICENSE is the verbatim license text
# that GitHub's license detection reads. .github/renovate.json5 is read by
# Renovate as is.
[[annotations]]
path = [
  "LICENSE",
  "README.md",
  ".github/CODEOWNERS",
  # A header comment here would land in every PR body.
  ".github/PULL_REQUEST_TEMPLATE.md",
  ".github/renovate.json5",
  ".gitattributes",
  ".gitignore",
  ".editorconfig",
  ".cspell.jsonc",
  ".bazelrc",
  "preset.bazelrc",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# Per-consumer files are copied into other repos, where those repos' own REUSE
# policy applies. Staging only; this directory is not committed here.
[[annotations]]
path = ["consumers/**"]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"
