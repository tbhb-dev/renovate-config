---
# Reusable PR gate that catches broken Renovate config before it lands on main.
# The cron Renovate workflow only fires on schedule, so a malformed config on
# main can sit unnoticed until the next run.
#
# Four checks run, because the validator alone is not enough:
#
# 1. `renovate-config-validator --strict` over every path in `configs`, from
#    the same digest-pinned image the Renovate workflow runs.
# 2. A preset-reference check. The validator never resolves `extends`, so a
#    `github>owner/repo//file#ref` that points at nothing still validates, and
#    Renovate later fails with config-presets-invalid and quietly stops opening
#    PRs. The second step fetches each reference at the `#ref` it names.
# 3. On pull requests, changed renovate-config and tbhb-dev/rules pins must
#    land on their upstream main branch. Commit ranges and changed upstream
#    files appear in the job summary. Other events skip this check.
# 4. Every pinned `tbhb-dev/renovate-config` preset and reusable workflow
#    reference must use the same full 40-character commit sha. Repositories
#    without these references pass.
#
# The workflow runs against the CALLER's checkout, so the check script is
# inlined here rather than committed as a file.
name: Validate Renovate configuration

on:
  workflow_call:
    inputs:
      configs:
        type: string
        description: "Newline-separated Renovate config paths, relative to the repo root"
        default: ".github/renovate.json5"
      runs_on:
        type: string
        description: "Runner label. Private callers pass their tbhb-dev-* label; public callers keep the default"
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate configuration
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      CONFIGS: ${{ inputs.configs }}
      # Same image as the `renovate-image` input in renovate.yaml; the shared
      # "renovate" group moves both in one PR.
      # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
      RENOVATE_IMAGE: "ghcr.io/renovatebot/renovate:44.206.2@sha256:d515a99f5d14d1c62b792ee61339d165dd9d20ee82ca9d5379daf639050bab51"
    steps:
      - name: Checkout configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate configuration
        run: |
          mapfile -t configs < <(printf '%s\n' "${CONFIGS}" | sed '/^[[:space:]]*$/d')
          docker run --rm --entrypoint renovate-config-validator \
            -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            "${RENOVATE_IMAGE}" --strict "${configs[@]}"

      - name: Verify preset references resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "${RUNNER_TEMP}/check-preset-refs.mjs" <<'MJS'
          import { existsSync, readFileSync } from "node:fs";
          import { createRequire } from "node:module";

          // json5 ships inside the Renovate image but is not resolvable from
          // the default module paths.
          const JSON5 = createRequire("/usr/local/renovate/").call(null, "json5");
          const selfRepo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const api = process.env.GITHUB_API_URL ?? "https://api.github.com";

          const refs = new Set();
          for (const file of process.argv.slice(2)) {
            const config = JSON5.parse(readFileSync(file, "utf8"));
            for (const entry of config.extends ?? []) {
              if (typeof entry === "string" && entry.startsWith("github>")) refs.add(entry);
            }
          }

          let failed = 0;
          for (const ref of [...refs].sort()) {
            // github>owner/repo//path, optionally with #ref. Any other shape
            // fails: a silently skipped reference is the failure this prevents.
            const m = /^github>([^/#:]+)\/([^/#:]+)\/\/([^#:]+)(?:#([^#:]+))?$/.exec(ref);
            if (!m) {
              console.log(`FAIL  ${ref} (unrecognized reference shape)`);
              failed += 1;
              continue;
            }
            const [, owner, repo, path, pinned] = m;
            const slug = `${owner}/${repo}`;
            if (slug === selfRepo && !pinned) {
              // Unpinned self-reference: check this PR's tree, so a preset
              // added or renamed in the same PR resolves against what lands.
              if (existsSync(path)) {
                console.log(`ok    ${slug}//${path} (this repo, PR tree)`);
              } else {
                console.log(`FAIL  ${slug}//${path} (not in this PR's tree)`);
                failed += 1;
              }
              continue;
            }
            // ?ref= makes a pinned reference mean something; without it the
            // API answers for the default branch.
            const url = new URL(`${api}/repos/${slug}/contents/${path}`);
            if (pinned) url.searchParams.set("ref", pinned);
            const response = await fetch(url, {
              headers: {
                accept: "application/vnd.github+json",
                ...(token ? { authorization: `Bearer ${token}` } : {}),
              },
            });
            const at = pinned ? `ref ${pinned}` : "default branch";
            if (response.ok) {
              console.log(`ok    ${slug}//${path} (${at})`);
            } else {
              console.log(`FAIL  ${slug}//${path} (${at}, HTTP ${response.status})`);
              failed += 1;
            }
          }
          if (refs.size === 0) console.log("no github> preset references to check");
          if (failed > 0) {
            console.log(`\n${failed} preset reference(s) did not resolve.`);
            process.exit(1);
          }
          MJS
          mapfile -t configs < <(printf '%s\n' "${CONFIGS}" | sed '/^[[:space:]]*$/d')
          docker run --rm --entrypoint node \
            -e GITHUB_REPOSITORY -e GH_TOKEN -e GITHUB_API_URL \
            -v "${GITHUB_WORKSPACE}:/repo" \
            -v "${RUNNER_TEMP}/check-preset-refs.mjs:/check-preset-refs.mjs:ro" \
            -w /repo "${RENOVATE_IMAGE}" \
            /check-preset-refs.mjs "${configs[@]}"

      - name: Summarize pin-bump ranges
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from collections import defaultdict
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def full_sha(ref):
              return re.fullmatch(r"[0-9a-f]{40}", ref) is not None

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True).stdout

          def api(endpoint):
              # Plain HTTPS keeps the check independent of whether the runner image ships gh.
              root = os.environ.get("GITHUB_API_URL", "https://api.github.com")
              request = Request(f"{root}/{endpoint}", headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except (OSError, ValueError) as error:
                  # Only the status or exception class: remote text must not reach workflow commands.
                  detail = f"HTTP {error.code}" if isinstance(error, HTTPError) else type(error).__name__
                  fail(f"Pin range check could not reach the GitHub API ({detail})")

          configs = {str(Path(name)) for name in os.environ["CONFIGS"].splitlines() if name.strip()}
          preset = re.compile(r'''["'](github>tbhb-dev/renovate-config//[^"'#\s]+)#([^"'\s]*)["']''')
          workflow = re.compile(
              r'''^\s*(?:-\s+)?uses:\s*["']?(tbhb-dev/renovate-config/\.github/workflows/[^@\s]+)@([^\s"'#]*)''',
              re.MULTILINE,
          )
          rules = re.compile(r'''(tbhb-dev/rules/[^\s"'@]+)@([^\s"'#),]*)''')
          tokens = re.compile(r'''"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|//[^\n]*|/\*.*?\*/|\#[^\n]*''', re.DOTALL)

          def pins(name, source):
              found = defaultdict(list)
              if name in configs:
                  clean = tokens.sub(lambda m: m[0] if m[0][0] in "\"'" else "", source)
                  for key, ref in preset.findall(clean):
                      found[("tbhb-dev/renovate-config", key)].append(ref)
              path = Path(name)
              if path.parent == Path(".github/workflows") and path.suffix in (".yml", ".yaml"):
                  for key, ref in workflow.findall(source):
                      found[("tbhb-dev/renovate-config", key)].append(ref)
              # Rules action references may also appear outside workflows.
              for key, ref in rules.findall(source):
                  found[("tbhb-dev/rules", key)].append(ref)
              if path.name == "MODULE.bazel" or path.suffix == ".bzl":
                  clean = tokens.sub(lambda m: m[0] if m[0][0] in "\"'" else "", source)
                  for body in re.findall(r"\bgit_override\s*\((.*?)\)", clean, re.DOTALL):
                      if re.search(r'''\bmodule_name\s*=\s*["']tbhb_rules["']''', body):
                          match = re.search(r'''\bcommit\s*=\s*["']([^"']*)["']''', body)
                          if match:
                              found[("tbhb-dev/rules", "git_override:tbhb_rules")].append(match[1])
              return found

          def source_at(sha, name):
              # Added and deleted files have no object on one side of the diff.
              result = subprocess.run(["git", "show", f"{sha}:{name}"], capture_output=True)
              return result.stdout.decode("utf-8", errors="replace") if result.returncode == 0 else ""

          try:
              base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
              if not full_sha(base) or not full_sha(head):
                  fail("Pin range check requires full base and head shas")
              names = git("diff", "--name-only", "--no-renames", "-z", base, head, "--").decode().split("\0")
              changes = defaultdict(set)
              for name in filter(None, names):
                  old, new = pins(name, source_at(base, name)), pins(name, source_at(head, name))
                  for key, refs in new.items():
                      previous = list(old.get(key, []))
                      added = []
                      for ref in refs:
                          if ref in previous:
                              previous.remove(ref)
                          else:
                              added.append(ref)
                      for index, ref in enumerate(added):
                          before = previous[index] if index < len(previous) else None
                          changes[(key[0], before, ref)].add(name)

              lines = ["## Pin-bump ranges", ""]
              for (repo, old, new), files in changes.items():
                  if not full_sha(new):
                      fail("Changed pin must use a full 40-character sha")
                  status = api(f"repos/{repo}/compare/{new}...main").get("status")
                  if status not in ("identical", "ahead"):
                      fail(f"Changed pin is not on main: {new}")
                  lines.extend([f"### {repo}", "", f"    {old or '(new pin)'} -> {new}", "", "Consumer files:", ""])
                  lines.extend(f"    {name!r}" for name in sorted(files))
                  if old is None:
                      lines.extend(["", "New pin has no previous range to compare.", ""])
                      continue
                  comparison = api(f"repos/{repo}/compare/{quote(old, safe='')}...{new}?per_page=50&page=1")
                  lines.extend(["", "Commits (at most 50):", ""])
                  for commit in comparison["commits"][:50]:
                      sha = commit["sha"]
                      if not full_sha(sha):
                          fail("Pin comparison returned an invalid commit sha")
                      subject = commit["commit"]["message"].splitlines()[0]
                      lines.append(f"    {sha[:12]} {subject}")
                  lines.extend(["", "Changed files:", ""])
                  lines.extend(f"    {file['filename']!r}" for file in comparison["files"])
                  lines.append("")
              if not changes:
                  lines.append("No pin changes.")
              # Do not let remote subjects or file names become workflow commands.
              summary = "\n".join(lines) + "\n"
              summary = "\n".join(" " + line if line.startswith("::") else line for line in summary.split("\n"))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
                  output.write(summary)
              print(f"Pin range check: {len(changes)} changed pins")
          except (OSError, ValueError, KeyError, IndexError, TypeError, AttributeError, subprocess.CalledProcessError):
              fail("Pin range check could not read history or compare pins")
          PY

      - name: Check renovate-config pin consistency
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import sys

          pins = []
          preset = re.compile(r'''["']github>tbhb-dev/renovate-config//[^"'#\s]+#([^"'\s]*)["']''')
          workflow = re.compile(
              r'''^\s*(?:-\s+)?uses:\s*["']?tbhb-dev/renovate-config/\.github/workflows/[^@\s]+@([^\s"'#]*)''',
              re.MULTILINE,
          )
          # Remove comments without touching markers inside quoted strings.
          tokens = re.compile(r'''"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|//[^\n]*|/\*.*?\*/''', re.DOTALL)
          for name in os.environ["CONFIGS"].splitlines():
              if name.strip():
                  source = tokens.sub(lambda m: m[0] if m[0][0] in "\"'" else "", Path(name).read_text())
                  pins.extend((name, ref) for ref in preset.findall(source))
          for path in sorted(Path(".github/workflows").glob("*")):
              if path.suffix in (".yml", ".yaml"):
                  pins.extend((str(path), ref) for ref in workflow.findall(path.read_text()))

          valid = lambda ref: re.fullmatch(r"[0-9a-f]{40}", ref) is not None
          if any(not valid(ref) for _, ref in pins) or len({ref for _, ref in pins}) > 1:
              for name, ref in pins:
                  # File paths may contain workflow command delimiters or newlines.
                  name = name.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  label = ref if valid(ref) else "(non-sha ref)"
                  print(f"::error::renovate-config pins must use one full sha: {name}: {label}")
              sys.exit(1)
          print(f"renovate-config pin consistency: {len(pins)} references, all pins consistent")
          PY
